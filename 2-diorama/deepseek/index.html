let seed = 0x7f4a3d21;
function rand() {
  seed |= 0;
  seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function rr(a, b) { return a + (b - a) * rand(); }
function ri(a, b) { return Math.floor(rr(a, b + 1)); }
function pick(list) { return list[Math.floor(rand() * list.length)]; }
function clamp01(x) { return Math.min(1, Math.max(0, x)); }
function smooth01(x) { x = clamp01(x); return x * x * (3 - 2 * x); }

const colorCache = new Map();
function colorOf(hex, intensity = 1) {
  const key = hex + ':' + intensity;
  if (!colorCache.has(key)) {
    const c = new THREE.Color(hex);
    if (intensity !== 1) c.multiplyScalar(intensity);
    colorCache.set(key, c);
  }
  return colorCache.get(key);
}
function shadeColor(hex, f) {
  const c = new THREE.Color(hex);
  c.multiplyScalar(f);
  return c.getHex();
}
function mixHex(a, b, t) {
  const c = new THREE.Color(a);
  c.lerp(new THREE.Color(b), t);
  return c.getHex();
}

const personVertexMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.82, metalness: 0.03 });
const propVertexMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.64, metalness: 0.16 });
const glowVertexMat = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false });
function rebuildMergedMesh(list, material, group) {
  if (list.length < 2) return;
  const geos = [];
  for (const child of list) {
    child.updateMatrix();
    const g = child.geometry.clone();
    g.applyMatrix4(child.matrix);
    const c = child.material.color;
    const n = g.attributes.position.count;
    const colors = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      colors[i * 3] = c.r;
      colors[i * 3 + 1] = c.g;
      colors[i * 3 + 2] = c.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geos.push(g);
  }
  const merged = mergeGeometries(geos, false);
  geos.forEach(g => g.dispose());
  if (!merged) return;
  merged.computeBoundingSphere();
  const mesh = new THREE.Mesh(merged, material);
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  group.add(mesh);
  for (const child of list) group.remove(child);
}
function mergeDirectMeshes(group, standardMaterial, glowMaterial) {
  const standard = [];
  const basic = [];
  for (const child of [...group.children]) {
    if (!child.isMesh || child.isInstancedMesh) continue;
    if (!child.material || child.material.transparent) continue;
    if (child.material.isMeshBasicMaterial) basic.push(child);
    else standard.push(child);
  }
  rebuildMergedMesh(standard, standardMaterial, group);
  rebuildMergedMesh(basic, glowMaterial, group);
}
function mergeGroupRecursive(group, standardMaterial = propVertexMat, glowMaterial = glowVertexMat) {
  for (const child of [...group.children]) {
    if (child.isGroup) mergeGroupRecursive(child, standardMaterial, glowMaterial);
  }
  mergeDirectMeshes(group, standardMaterial, glowMaterial);
}

  const h = Math.max(1, window.innerHeight);
  return Math.min(window.devicePixelRatio || 1, 1.5, Math.sqrt(2800000 / (w * h)));
}

const wetShader = {
  name: 'WetAsphalt',
  uniforms: {
    color: { value: null },
    tDiffuse: { value: null },
    textureMatrix: { value: null },
    uTime: { value: 0 }
  },
  vertexShader: `
    uniform mat4 textureMatrix;
    varying vec4 vUv;
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      vUv = textureMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 color;
    uniform sampler2D tDiffuse;
    uniform float uTime;
    varying vec4 vUv;
    varying vec3 vWorldPos;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 4; i++) {
        v += a * vnoise(p);
        p = p * 2.03 + vec2(1.7, 9.2);
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec3 V = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - clamp(V.y, 0.0, 1.0), 2.1);
      vec2 p = vWorldPos.xz;

      float broad = fbm(p * 0.42 + vec2(uTime * 0.011, -uTime * 0.007));
      float fine = fbm(p * 1.72 + 4.7);
      float puddle = smoothstep(0.35, 0.70, broad);

      float rippleA = sin(p.x * 2.1 + uTime * 1.55 + sin(p.y * 1.7 - uTime * 0.8) * 2.0);
      float rippleB = sin(p.y * 3.0 - uTime * 1.15 + sin(p.x * 2.3 + uTime * 0.6) * 1.4);
      vec2 grain = vec2(vnoise(p * 4.0 + uTime * 0.1), vnoise(p * 4.0 - uTime * 0.08 + 5.0)) - 0.5;
      vec2 distort = vec2(rippleA, rippleB) * 0.0011 * (0.4 + fine) + grain * 0.0024;

      vec4 uv = vUv;
      uv.xy += distort * uv.w;
      vec3 refl = texture2DProj(tDiffuse, uv).rgb;

      float wet = 0.16 + 0.84 * puddle;
      float strength = wet * mix(0.48, 1.0, fres);
      vec3 asphalt = mix(vec3(0.0038, 0.0052, 0.0078), vec3(0.014, 0.017, 0.022), fine * 0.65 + broad * 0.35);
      vec3 hot = max(refl - vec3(0.20), 0.0);
      vec3 col = asphalt + refl * strength * 0.86 + hot * strength * 0.40;
      col += refl * smoothstep(0.62, 0.95, fine + broad * 0.25) * 0.10;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
};

const wetGround = new Reflector(new THREE.PlaneGeometry(50.4, 32.4), {

const batches = { solid: [], metal: [], glow: [] };
function addMatrix(kind, color, matrix) {
  batches[kind].push({ matrix, color });
}
function put(kind, hex, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0, intensity = 1) {
  tmpObj.position.set(x, y, z);
  tmpObj.rotation.set(rx, ry, rz);
  tmpObj.scale.set(sx, sy, sz);
  tmpObj.updateMatrix();
  addMatrix(kind, colorOf(hex, intensity), tmpObj.matrix.clone());
}
function solid(hex, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
  put('solid', hex, x, y, z, sx, sy, sz, rx, ry, rz, 1);
}
function metal(hex, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
  put('metal', hex, x, y, z, sx, sy, sz, rx, ry, rz, 1);
}
function glow(hex, x, y, z, sx, sy, sz, intensity = 2.4) {
  put('glow', hex, x, y, z, sx, sy, sz, 0, 0, 0, intensity);
}
function wireSegment(a, b, thickness = 0.028, hex = 0x14161c) {
  tmpVec.subVectors(b, a);
  const len = tmpVec.length();
  if (len < 0.0001) return;
  tmpQuat.setFromUnitVectors(up, tmpVec.normalize());
  tmpVec.addVectors(a, b).multiplyScalar(0.5);
  const m = new THREE.Matrix4().compose(tmpVec, tmpQuat, new THREE.Vector3(thickness, len, thickness));
  addMatrix('solid', colorOf(hex), m);
}

const FACE_BASIS = {
  zPos: { u: [1, 0, 0], v: [0, 1, 0], n: [0, 0, 1] },
  zNeg: { u: [-1, 0, 0], v: [0, 1, 0], n: [0, 0, -1] },
  xPos: { u: [0, 0, -1], v: [0, 1, 0], n: [1, 0, 0] },
  xNeg: { u: [0, 0, 1], v: [0, 1, 0], n: [-1, 0, 0] }
};
function faceBox(kind, hex, face, x, y, z, su, sv, sn, intensity = 1) {
  const b = FACE_BASIS[face];
  const sx = Math.abs(b.u[0]) * su + Math.abs(b.v[0]) * sv + Math.abs(b.n[0]) * sn;
  const sy = Math.abs(b.u[1]) * su + Math.abs(b.v[1]) * sv + Math.abs(b.n[1]) * sn;
  const sz = Math.abs(b.u[2]) * su + Math.abs(b.v[2]) * sv + Math.abs(b.n[2]) * sn;
  put(kind, hex, x, y, z, sx, sy, sz, 0, 0, 0, intensity);
}
function faceOffset(face, u, v, n) {
  const b = FACE_BASIS[face];
  return new THREE.Vector3(
    b.u[0] * u + b.v[0] * v + b.n[0] * n,
    b.u[1] * u + b.v[1] * v + b.n[1] * n,
    b.u[2] * u + b.v[2] * v + b.n[2] * n
  );
}

const glyphCache = new Map();
const GRID = 16;
function glyphMask(ch) {
  if (glyphCache.has(ch)) return glyphCache.get(ch);
  const S = 256;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const family = '"Microsoft YaHei","PingFang SC","Heiti SC","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei","SimHei",sans-serif';
  ctx.font = '900 ' + Math.round(S * 0.80) + 'px ' + family;
  ctx.fillText(ch, S * 0.5, S * 0.53);
  const img = ctx.getImageData(0, 0, S, S).data;
  const cells = new Uint8Array(GRID * GRID);
  let any = false;
  for (let gy = 0; gy < GRID; gy++) {
    for (let gx = 0; gx < GRID; gx++) {
      let acc = 0;
      for (let sy = 0; sy < 3; sy++) {
        for (let sx = 0; sx < 3; sx++) {
          const px = Math.min(S - 1, Math.floor((gx + 0.25 + sx * 0.25) / GRID * S));
          const py = Math.min(S - 1, Math.floor((gy + 0.25 + sy * 0.25) / GRID * S));
          acc += img[(py * S + px) * 4 + 3];
        }
      }
      if (acc / 9 > 44) {
        cells[gy * GRID + gx] = 1;
        any = true;
      }
    }
  }
  if (!any) cells[8 * GRID + 8] = 1;
  glyphCache.set(ch, cells);
  return cells;
}
function addVoxelText(text, opts) {
  const {
    face = 'zPos', x = 0, y = 0, z = 0, cell = 0.05, vertical = false,
    hex = 0xffffff, intensity = 2.6, thickness = 0.055, gap = 1.10, nOffset = 0
  } = opts;
  const chars = Array.from(text);
  const pitch = GRID * cell * gap;
  for (let ci = 0; ci < chars.length; ci++) {
    const ch = chars[ci];
    if (ch === ' ' || ch === '·') {
      if (ch === '·') {
        const b = FACE_BASIS[face];
        const u = vertical ? 0 : (ci - (chars.length - 1) * 0.5) * pitch;
        const v = vertical ? ((chars.length - 1) * 0.5 - ci) * pitch : 0;
        const p = faceOffset(face, u, v, nOffset);
        faceBox('glow', hex, face, x + p.x, y + p.y, z + p.z, cell * 0.75, cell * 0.75, thickness, intensity);
      }
      continue;
    }
    const mask = glyphMask(ch);
    const cu = vertical ? 0 : (ci - (chars.length - 1) * 0.5) * pitch;
    const cv = vertical ? ((chars.length - 1) * 0.5 - ci) * pitch : 0;
    for (let gy = 0; gy < GRID; gy++) {
      for (let gx = 0; gx < GRID; gx++) {
        if (!mask[gy * GRID + gx]) continue;
        const u = cu + (gx - (GRID - 1) * 0.5) * cell;
        const v = cv + ((GRID - 1) * 0.5 - gy) * cell;
        const p = faceOffset(face, u, v, nOffset);
        faceBox('glow', hex, face, x + p.x, y + p.y, z + p.z, cell * 0.94, cell * 0.94, thickness, intensity);
      }
    }
  }
}

function addSignBoard(opts) {
  const {
    face, x, y, z, width, height, text, hex, bg = 0x0b0d13,
    intensity = 2.7, vertical = false, backFace = false, cell
  } = opts;
  const b = FACE_BASIS[face];
  faceBox('solid', bg, face, x, y, z, width, height, 0.16);
  faceBox('glow', hex, face, x, y, z, width + 0.18, height + 0.14, 0.012, 0.55);
  const strip = 0.035;
  const top = faceOffset(face, 0, height * 0.5 - strip * 0.5, 0.095);
  const bot = faceOffset(face, 0, -height * 0.5 + strip * 0.5, 0.095);
  const lef = faceOffset(face, -width * 0.5 + strip * 0.5, 0, 0.095);
  const rig = faceOffset(face, width * 0.5 - strip * 0.5, 0, 0.095);
  faceBox('glow', hex, face, x + top.x, y + top.y, z + top.z, width, strip, 0.035, intensity);
  faceBox('glow', hex, face, x + bot.x, y + bot.y, z + bot.z, width, strip, 0.035, intensity);
  faceBox('glow', hex, face, x + lef.x, y + lef.y, z + lef.z, strip, height, 0.035, intensity);
  faceBox('glow', hex, face, x + rig.x, y + rig.y, z + rig.z, strip, height, 0.035, intensity);
  const nOff = faceOffset(face, 0, 0, 0.115);
  const glyphCount = Math.max(1, Array.from(text).length);
  const cellFit = vertical
    ? Math.min(height * 0.86 / (glyphCount * GRID * 1.08), width * 0.74 / GRID)
    : Math.min(height * 0.74 / GRID, width * 0.84 / (glyphCount * GRID * 1.08));
  addVoxelText(text, {
    face, x: x + nOff.x, y: y - 0.01, z: z + nOff.z,
    cell: cell || cellFit,
    vertical, hex, intensity, gap: 1.08
  });
  if (backFace) {
    const backBase = faceOffset(face, 0, 0, -0.095);
    const backN = faceOffset(face, 0, 0, -0.115);
    const backFaceName = face === 'zPos' ? 'zNeg' : face === 'zNeg' ? 'zPos' : face === 'xPos' ? 'xNeg' : 'xPos';
    const bTop = faceOffset(backFaceName, 0, height * 0.5 - strip * 0.5, 0);
    const bBot = faceOffset(backFaceName, 0, -height * 0.5 + strip * 0.5, 0);
    const bLef = faceOffset(backFaceName, -width * 0.5 + strip * 0.5, 0, 0);
    const bRig = faceOffset(backFaceName, width * 0.5 - strip * 0.5, 0, 0);
    faceBox('glow', hex, backFaceName, x + backBase.x + bTop.x, y + bTop.y, z + backBase.z + bTop.z, width, strip, 0.035, intensity);
    faceBox('glow', hex, backFaceName, x + backBase.x + bBot.x, y + bBot.y, z + backBase.z + bBot.z, width, strip, 0.035, intensity);
    faceBox('glow', hex, backFaceName, x + backBase.x + bLef.x, y + bLef.y, z + backBase.z + bLef.z, strip, height, 0.035, intensity);
    faceBox('glow', hex, backFaceName, x + backBase.x + bRig.x, y + bRig.y, z + backBase.z + bRig.z, strip, height, 0.035, intensity);
    addVoxelText(text, {
      face: backFaceName, x: x + backN.x, y: y - 0.01, z: z + backN.z,
      cell: cell || cellFit,
      vertical, hex, intensity, gap: 1.08, nOffset: 0.005
    });
  }
}

function addWindow(outward, wx, wy, zFace, ww, wh, lit, accent, bars = false, balcony = false) {
  const z0 = zFace + outward * 0.045;
  solid(0x080b10, wx, wy, z0, ww + 0.13, wh + 0.13, 0.07);
  const litCol = lit ? (rand() < 0.35 ? 0xff8b4d : 0xffb66e) : 0x0b1821;
  if (lit) {
    glow(litCol, wx, wy, z0 + outward * 0.065, ww - 0.13, wh - 0.17, 0.035, rr(0.55, 0.95));
    if (rand() < 0.45) solid(0x2b2630, wx + rr(-0.15, 0.15), wy, z0 + outward * 0.09, ww * rr(0.22, 0.45), wh - 0.17, 0.025);
  } else {
    solid(0x0a151d, wx, wy, z0 + outward * 0.055, ww - 0.14, wh - 0.16, 0.035);

  for (let i = 0; i < stripes; i++) {

function addBuilding(c, index) {
  const { x0, x1, h, shopH, depth, color, trim, accent, name, blade, side, signY, awning = true } = c;
  const w = x1 - x0;
  const cx = (x0 + x1) * 0.5;
  const zFront = side * 6.6;
  const zBack = zFront + side * depth;
  const zc = (zFront + zBack) * 0.5;
  const outward = -side;
  c.zFront = zFront;
  c.zBack = zBack;
  c.cx = cx;
  c.w = w;

  solid(color, cx, (shopH + h) * 0.5, zc, w, h - shopH, depth);
  solid(shadeColor(color, 0.72), cx, shopH + 0.2, zFront + outward * 0.04, w, 0.4, 0.22);
  solid(trim, x0 + 0.11, h * 0.5, zFront + outward * 0.06, 0.22, h, 0.22);
  solid(trim, x1 - 0.11, h * 0.5, zFront + outward * 0.06, 0.22, h, 0.22);
  solid(shadeColor(color, 0.36), cx, shopH * 0.5, zBack - side * 0.18, w, shopH, 0.38);
  solid(shadeColor(color, 0.44), x0 + 0.18, shopH * 0.5, zc, 0.38, shopH, depth);
  solid(shadeColor(color, 0.44), x1 - 0.18, shopH * 0.5, zc, 0.38, shopH, depth);
  solid(shadeColor(color, 0.5), cx, shopH - 0.15, zc, w - 0.36, 0.28, depth - 0.2);
  solid(0x14171c, cx, 0.09, zc, w - 0.4, 0.18, depth - 0.45);
  solid(0x1b1716, cx, 0.17, zFront + outward * -0.8, w - 0.8, 0.12, 1.5);
  addShopInterior(c, index, shopH);

  const floorH = 2.58;
  const floors = Math.max(1, Math.floor((h - shopH - 0.72) / floorH));
  for (let f = 0; f < floors; f++) {
    const wy = shopH + 1.28 + f * floorH;
    if (wy + 0.72 > h - 0.22) continue;
    solid(trim, cx, wy - 0.84, zFront + outward * 0.09, w - 0.55, 0.1, 0.22);
    const cols = Math.max(2, Math.floor(w / 1.75));
    for (let col = 0; col < cols; col++) {
      const wx = x0 + 0.86 + (w - 1.72) * (col + 0.5) / cols;
      const lit = rand() < 0.40;
      const balcony = f === 0 && rand() < 0.28;
      addWindow(outward, wx, wy, zFront, 0.82, 1.08, lit, accent, rand() < 0.2, balcony);
      if (rand() < 0.28) addAC(outward, wx + rr(-0.15, 0.15), wy - 0.88, zFront);
    }
  }

  const backFloors = Math.max(1, floors - (rand() < 0.35 ? 1 : 0));
  for (let f = 0; f < backFloors; f++) {
    const wy = shopH + 1.18 + f * floorH;
    if (wy + 0.65 > h - 0.25) continue;
    const cols = Math.max(2, Math.floor(w / 2.25));
    for (let col = 0; col < cols; col++) {
      const wx = x0 + 0.8 + (w - 1.6) * (col + 0.5) / cols;
      const zBackFace = zBack;
      solid(0x080b10, wx, wy, zBackFace + side * 0.045, 0.74, 0.92, 0.07);
      if (rand() < 0.46) {
        glow(rand() < 0.5 ? 0xff995a : 0xffc67a, wx, wy, zBackFace + side * 0.10, 0.6, 0.75, 0.035, rr(0.55, 1.05));
      } else {
        solid(0x0a141b, wx, wy, zBackFace + side * 0.10, 0.6, 0.74, 0.035);
      }
      metal(0x151d23, wx, wy, zBackFace + side * 0.12, 0.03, 0.8, 0.03);
      if (rand() < 0.2) addAC(side, wx + rr(-0.12, 0.12), wy - 0.72, zBackFace);
    }
  }

  if (side === 1 && rand() < 0.62) {
    const backFaceZ = zBack + side * 0.29;
    addSignBoard({
      face: 'zPos', x: cx + rr(-w * 0.18, w * 0.18), y: rr(shopH + 1.9, h - 1.35), z: backFaceZ,
      width: Math.min(2.2, w * 0.44), height: 0.72,
      text: pick(['夜', '宿', '茶', '潮', '粤']), hex: accent, intensity: rr(1.7, 2.6), cell: 0.03
    });
  }
  addPipe(outward, x0 + rr(0.55, 0.8), zFront, h, 0x202b32);
  if (rand() < 0.65) addPipe(outward, x1 - rr(0.45, 0.7), zFront, h, 0x1d272d);
  if (rand() < 0.5) addPipe(side, cx + rr(-w * 0.3, w * 0.3), zBack, h, 0x20282e);

  if (side === -1) {
    solid(0x161d22, x0 + 0.48, 2.2, zFront + outward * 0.35, 0.05, 0.55, 0.55);
  } else {
    solid(0x161d22, x1 - 0.48, 2.2, zFront + outward * 0.35, 0.05, 0.55, 0.55);
  }

  if (awning) addAwning(x0, x1, shopH, zFront, outward, accent);

  const signFace = outward > 0 ? 'zPos' : 'zNeg';
  const signZ = zFront + outward * 0.29;
  const signWidth = Math.min(w * 0.82, 4.7);
  const signHeight = signY || 0.86;
  const signCenterY = shopH + 0.69;
  addSignBoard({
    face: signFace, x: cx, y: signCenterY, z: signZ,
    width: signWidth, height: signHeight, text: name, hex: accent, intensity: rr(2.2, 3.1)
  });
  solid(0x101419, cx - signWidth * 0.5 + 0.2, shopH + 0.05, zFront + outward * 0.17, 0.28, 0.23, 0.24);

  if (blade) {
    const bx = rand() < 0.5 ? x0 + 0.72 : x1 - 0.72;
    const bladeH = Math.min(2.45, h - 4.1);
    if (bladeH > 1.1) {
      const by = shopH + 2.05;
      const bz = zFront + outward * 0.45;
      metal(0x141b20, bx, by + bladeH * 0.5 - 0.1, zFront + outward * 0.06, 0.06, 0.06, 0.95);
      metal(0x141b20, bx, by - bladeH * 0.5 + 0.1, zFront + outward * 0.06, 0.06, 0.06, 0.95);
      addSignBoard({
        face: 'xPos', x: bx, y: by, z: bz,
        width: 1.0, height: bladeH, text: blade, hex: accent,
        intensity: 2.9, vertical: true, backFace: true
      });
    }
  }

  if (index % 3 === 1) {
    const lx = x0 + w * 0.5;
    solid(0x2a3134, lx, 2.95, zFront + outward * 0.74, 0.08, 0.08, 1.45);
    glow(0xffd59a, lx, 2.84, zFront + outward * 1.42, 0.2, 0.14, 0.2, 2.5);
  }
  addRoof(c, shopH);
  return c;
}

const stdMatCache = new Map();
function stdMat(hex, roughness = 0.76, metalness = 0.02) {
  const key = hex + ':' + roughness + ':' + metalness;
  if (!stdMatCache.has(key)) stdMatCache.set(key, new THREE.MeshStandardMaterial({ color: hex, roughness, metalness }));
  return stdMatCache.get(key);
}
const basicMatCache = new Map();
function basicMat(hex, intensity = 1) {
  const key = hex + ':' + intensity;
  if (!basicMatCache.has(key)) basicMatCache.set(key, new THREE.MeshBasicMaterial({ color: colorOf(hex, intensity), toneMapped: false }));
  return basicMatCache.get(key);
}

const blobFlatMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.16, depthWrite: false });
function meshPart(parent, hex, x, y, z, sx, sy, sz, roughness = 0.76, metalness = 0.02, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(boxGeo, stdMat(hex, roughness, metalness));

  m.rotation.set(rx, ry, rz);
  parent.add(m);

}
function glowPart(parent, hex, intensity, x, y, z, sx, sy, sz) {
  const m = new THREE.Mesh(boxGeo, basicMat(hex, intensity));

}
function addContactBlob(parent, x, y, z, w, d, wide = false) {

}

function catenaryPoint(a, b, t, sag) {
  const p = new THREE.Vector3().lerpVectors(a, b, t);
  p.y -= Math.sin(Math.PI * t) * sag;
  return p;
}
function addLanternString(a, b, sag, count, withBulbs = true) {
  const steps = 18;
  let prev = a.clone();
  for (let i = 1; i <= steps; i++) {
    const p = catenaryPoint(a, b, i / steps, sag);
    wireSegment(prev, p, 0.025, 0x11131a);
    if (withBulbs && i % 3 === 0) {
      glow(0xffd7a0, p.x, p.y - 0.06, p.z, 0.055, 0.075, 0.055, 1.7);
      wireSegment(p, new THREE.Vector3(p.x, p.y - 0.06, p.z), 0.008, 0x07090d);
    }
    prev = p;
  }
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count;
    const p = catenaryPoint(a, b, t, sag);
    addLantern(p.x, p.y, p.z, rr(0.22, 0.35), 1);
    if (rand() < 0.35) {
      glow(0xffd7a0, p.x + rr(-0.3, 0.3), p.y - 0.03, p.z, 0.045, 0.06, 0.045, 1.4);
    }
  }
}
function addCable(a, b, sag, steps = 16) {
  let prev = a.clone();
  for (let i = 1; i <= steps; i++) {
    const p = catenaryPoint(a, b, i / steps, sag);
    wireSegment(prev, p, 0.023, 0x11131a);
    prev = p;
  }
}

function animatePerson(p, t) {
  if (p.walk) {
    const w = p.walk;
    const a = t * w.speed + w.phase;
    const vx = Math.cos(a) * w.amp * w.speed;
    const px = w.centerX + Math.sin(a) * w.amp;
    const pz = w.lane + Math.sin(a * 0.63 + w.phase) * 0.26;
    p.root.position.x = px;
    p.root.position.z = pz;
    p.root.position.y = p.baseY + Math.abs(Math.sin(t * 7.4 + w.phase)) * 0.027;
    const targetYaw = vx >= 0 ? Math.PI / 2 : -Math.PI / 2;
    let diff = targetYaw - p.walk.lastYaw;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    p.walk.lastYaw += diff * 0.08;
    p.root.rotation.y = p.walk.lastYaw;
    const gait = Math.sin(t * 8.1 + w.phase);
    p.legL.rotation.x = gait * 0.5;
    p.legR.rotation.x = -gait * 0.5;
    if (!p.umb) p.armL.rotation.x = -gait * 0.36;
    p.armR.rotation.x = gait * 0.25 + (p.umb ? -1.08 : 0);
    p.headGroup.rotation.y = Math.sin(t * 0.45 + w.phase) * 0.12;
    p.headGroup.rotation.x = 0.02;
    if (p.umb) p.umb.rotation.z = Math.sin(t * 1.4 + w.phase) * 0.03;
    return;
  }
  const s = p.phase;
  p.root.position.y = p.baseY + Math.sin(t * 1.35 + s) * 0.006;
  const baseHeadY = Math.sin(t * 0.31 + s) * 0.1;
  switch (p.role) {
    case 'eater': {
      const bite = Math.max(0, Math.sin(t * 2.8 + s));
      p.armR.rotation.x = -0.55 - bite * 0.68;
      p.armR.rotation.z = -0.3 - bite * 0.12;
      p.armL.rotation.x = -0.52 + Math.sin(t * 2.8 + s) * 0.05;
      p.headGroup.rotation.x = bite * 0.07;
      p.headGroup.rotation.y = baseHeadY * 0.4;
      p.torso.rotation.x = 0.03;
      break;
    }
    case 'chat': {
      p.armR.rotation.x = -0.25 + Math.sin(t * 1.8 + s) * 0.18;
      p.armR.rotation.z = -0.18;
      p.armL.rotation.x = -0.2 + Math.cos(t * 1.55 + s) * 0.14;
      p.headGroup.rotation.y = baseHeadY * 1.4 + 0.15;
      p.headGroup.rotation.x = Math.sin(t * 1.9 + s) * 0.03;
      break;
    }
    case 'bargain': {
      const wave = Math.sin(t * 2.5 + s);
      p.armR.rotation.x = -1.0 + wave * 0.25;
      p.armR.rotation.z = -0.25 - wave * 0.12;
      p.armL.rotation.x = -0.55 - wave * 0.2;
      p.armL.rotation.z = 0.18;
      p.torso.rotation.x = 0.08;
      p.headGroup.rotation.y = Math.sin(t * 0.9 + s) * 0.22;
      p.headGroup.rotation.x = 0.06;
      break;
    }
    case 'bargainBuyer': {
      const wave = Math.sin(t * 2.1 + s + 1.0);
      p.armR.rotation.x = -1.28 + wave * 0.16;
      p.armR.rotation.z = -0.5;
      p.armL.rotation.x = -0.35;
      p.torso.rotation.x = 0.11;
      p.headGroup.rotation.y = Math.sin(t * 0.8 + s) * 0.16;
      p.headGroup.rotation.x = 0.08;
      break;
    }
    case 'seller': {
      const wave = Math.sin(t * 1.6 + s);
      p.armL.rotation.x = -0.55;
      p.armL.rotation.z = 0.12;
      p.armR.rotation.x = -0.7 + wave * 0.22;
      p.armR.rotation.z = -0.2;
      p.headGroup.rotation.y = Math.sin(t * 0.55 + s) * 0.18;
      break;
    }
    case 'cook': {
      const stir = Math.sin(t * 5.2 + s);
      p.armR.rotation.x = -0.88 + stir * 0.22;
      p.armR.rotation.z = -0.28;
      p.armL.rotation.x = -0.35 + Math.cos(t * 3.3 + s) * 0.1;
      p.headGroup.rotation.x = 0.11;
      p.headGroup.rotation.y = baseHeadY * 0.5;
      p.torso.rotation.x = 0.055;
      break;
    }
    case 'vendor': {
      p.armL.rotation.x = -0.18;
      p.armR.rotation.x = -0.15 + Math.sin(t * 0.9 + s) * 0.05;
      p.headGroup.rotation.y = baseHeadY;
      break;
    }
    case 'phone': {
      p.armR.rotation.x = -1.5;
      p.armR.rotation.z = 0.78;
      p.headGroup.rotation.y = baseHeadY * 0.45 - 0.12;
      p.headGroup.rotation.x = 0.02;
      p.armL.rotation.x = -0.1 + Math.sin(t * 0.45 + s) * 0.03;
      break;
    }
    default: {
      p.armL.rotation.x = Math.sin(t * 0.75 + s) * 0.035;
      p.armR.rotation.x = -Math.sin(t * 0.7 + s) * 0.035;
      p.headGroup.rotation.y = baseHeadY;
      p.headGroup.rotation.x = Math.sin(t * 0.38 + s) * 0.025;
      if (p.seated) {
        p.torso.rotation.x = 0.02 + Math.sin(t * 0.9 + s) * 0.015;
      }
    }
  }
}

let lanternBody, lanternCaps, lanternCords;
function initLanterns() {
  const n = lanterns.length;
  lanternBody = new THREE.InstancedMesh(boxGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }), n);
  lanternCaps = new THREE.InstancedMesh(boxGeo, new THREE.MeshBasicMaterial({ color: 0x1a0c09, toneMapped: false }), n * 3);
  lanternCords = new THREE.InstancedMesh(boxGeo, new THREE.MeshBasicMaterial({ color: 0x0a0808, toneMapped: false }), n);
  for (const mesh of [lanternBody, lanternCaps, lanternCords]) {
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.frustumCulled = false;
    scene.add(mesh);
  }
  lanterns.forEach((l, i) => {
    lanternBody.setColorAt(i, colorOf(l.color, 1.45));
    lanternCaps.setColorAt(i * 3, colorOf(0x2b1710));
    lanternCaps.setColorAt(i * 3 + 1, colorOf(0x23120e));
    lanternCaps.setColorAt(i * 3 + 2, colorOf(0x9d5a2e, 0.6));
  });
  lanternBody.instanceColor.needsUpdate = true;
  lanternCaps.instanceColor.needsUpdate = true;
}
function updateLanterns(t) {
  if (!lanternBody) return;
  const e = new THREE.Euler();
  const top = new THREE.Vector3();
  const body = new THREE.Vector3();
  const anchor = new THREE.Vector3();
  const cap = new THREE.Vector3();
  const dir = new THREE.Vector3();
  for (let i = 0; i < lanterns.length; i++) {
    const l = lanterns[i];
    const s = l.size;
    e.set(Math.sin(t * 1.18 + l.phase) * l.amp, 0, Math.cos(t * 0.93 + l.phase * 1.3) * l.amp * 0.7);
    tmpQuat.setFromEuler(e);
    anchor.set(l.x, l.y, l.z);
    top.set(0, -l.len, 0).applyQuaternion(tmpQuat).add(anchor);
    body.set(0, -s * 0.67, 0).applyQuaternion(tmpQuat).add(top);
    tmpObj.position.copy(body);
    tmpObj.quaternion.copy(tmpQuat);
    tmpObj.scale.set(s, s * 1.33, s);
    tmpObj.updateMatrix();
    lanternBody.setMatrixAt(i, tmpObj.matrix);
    for (let k = 0; k < 3; k++) {
      const dy = k === 0 ? 0.02 : k === 1 ? -s * 1.27 : -s * 1.47;
      const sy = k === 0 ? 0.055 : k === 1 ? 0.05 : s * 0.34;
      const sxz = k === 0 ? s * 0.48 : k === 1 ? s * 0.4 : s * 0.045;
      cap.set(0, dy, 0).applyQuaternion(tmpQuat).add(body);
      tmpObj.position.copy(cap);
      tmpObj.quaternion.copy(tmpQuat);
      tmpObj.scale.set(sxz, sy, sxz);
      tmpObj.updateMatrix();
      lanternCaps.setMatrixAt(i * 3 + k, tmpObj.matrix);
    }
    dir.subVectors(top, anchor);
    const len = Math.max(dir.length(), 0.001);
    dir.normalize();
    tmpQuat.setFromUnitVectors(up, dir);
    tmpObj.position.addVectors(anchor, top).multiplyScalar(0.5);
    tmpObj.quaternion.copy(tmpQuat);
    tmpObj.scale.set(0.012, len, 0.012);
    tmpObj.updateMatrix();
    lanternCords.setMatrixAt(i, tmpObj.matrix);
  }
  lanternBody.instanceMatrix.needsUpdate = true;
  lanternCaps.instanceMatrix.needsUpdate = true;
  lanternCords.instanceMatrix.needsUpdate = true;
}

      speed: rr(8.5, 14.5), len: rr(0.14, 0.38), phase: rr(0, 6.28), thick: rr(0.010, 0.018)

function updateRain(dt, t) {
  for (let i = 0; i < rainDrops.length; i++) {
    const d = rainDrops[i];
    d.y -= d.speed * dt;
    d.x -= dt * 0.52;
    if (d.y < 0.1) {
      d.y = rr(13, 18);
      d.x = rr(-28, 28);
      d.z = rr(-7.2, 7.2);
    }
    if (d.x < -29) d.x += 58;
    tmpObj.position.set(d.x, d.y, d.z);
    tmpObj.rotation.set(0, 0, -0.06);
    tmpObj.scale.set(d.thick, d.len * (0.82 + 0.18 * Math.sin(t + d.phase)), d.thick);
    tmpObj.updateMatrix();
    rainMesh.setMatrixAt(i, tmpObj.matrix);
  }
  rainMesh.instanceMatrix.needsUpdate = true;
}

  for (let i = 0; i < 120; i++) {
    splashes.push({
      x: rr(-24, 24), z: rr(-5.1, 5.1), age: rr(0, 1), life: rr(0.35, 0.8), size: rr(0.2, 0.55)
    });

function resetSplash(s) {
  s.x = rr(-24, 24);
  s.z = rr(-5.1, 5.1);
  s.age = 0;
  s.life = rr(0.35, 0.8);
  s.size = rr(0.2, 0.55);
}
function updateSplashes(dt) {
  for (let i = 0; i < splashes.length; i++) {
    const s = splashes[i];
    s.age += dt;
    if (s.age > s.life) resetSplash(s);
    const a = s.age / s.life;
    const sc = s.size * (0.08 + a * 0.8);
    const fade = 1 - a;
    tmpObj.position.set(s.x, 0.055, s.z);
    tmpObj.rotation.set(0, 0, 0);

    camera.position.lerpVectors(returnState.startPos, returnState.destPos, e);
    camera.quaternion.slerpQuaternions(returnState.startQuat, returnState.destQuat, e);
    camera.fov = THREE.MathUtils.lerp(returnState.startFov, returnState.destFov, e);
    camera.updateProjectionMatrix();
    controls.target.lerpVectors(returnState.startPos, returnState.destTarget, e);
    if (returnState.t >= 1) {
      mode = 'auto';
      returnState = null;
    }
  }

  wetGround.material.uniforms.uTime.value = elapsed;
  updateLanterns(elapsed);
  for (const p of people) animatePerson(p, elapsed);
  for (const f of flames) {
    const flick = 0.72 + 0.28 * Math.sin(elapsed * 17 + f.phase) + 0.12 * Math.sin(elapsed * 31 + f.phase * 2);
    f.mesh.scale.set(f.baseX * (0.9 + 0.1 * Math.sin(elapsed * 23 + f.phase)), 0.06 + 0.05 * flick, f.baseZ * (0.92 + 0.08 * Math.cos(elapsed * 19 + f.phase)));
    f.mesh.rotation.y = elapsed * 0.8 + f.phase;
  }
  updateScooters(elapsed);
  updateRain(dt, elapsed);
  updateSplashes(dt);
  updateSteam(dt, elapsed);
  updateDust(elapsed);
  if (cat) {
    cat.tail.rotation.z = Math.sin(elapsed * 1.5 + 1.2) * 0.18;
    cat.tail.rotation.y = Math.sin(elapsed * 0.8) * 0.25;
  }
  for (let i = 0; i < flickerLights.length; i++) {
    const l = flickerLights[i];
    const n = Math.sin(elapsed * 9.1 + i * 2.3) * 0.5 + Math.sin(elapsed * 21.7 + i * 4.1) * 0.5;
    l.intensity = l.userData.base * (0.84 + 0.16 * n);
  }
  gradePass.uniforms.uTime.value = elapsed;
  composer.render(dt);
  if (firstFrame) {
    firstFrame = false;
    requestAnimationFrame(() => document.getElementById('veil').classList.add('shown'));
  }
}

window.__nightMarket = {
  setTime(seconds, freeze = true) {
    autoTime = ((seconds % LOOP_SECONDS) + LOOP_SECONDS) % LOOP_SECONDS;
    mode = 'auto';
    returnState = null;
    controls.enabled = false;
    timeFrozen = freeze;
    const u = autoTime / LOOP_SECONDS;
    setCameraAuto(u);
  },
  resume() { timeFrozen = false; },
  enterFreeCamera,
  camera, scene, renderer, composer,
  get mode() { return mode; },
  get time() { return autoTime; }
};

buildBaseAndBuildings();
buildStreet();
addArch();
buildCarts();
buildTables();
buildProduceStand();
buildStreetProps();
addLandmarkSigns();
buildWires();
buildPeople();
cat = createCat(9.1, 0.99, -5.76, 1.2);
addExtraSteam();
finalizeStatic();
initLanterns();
initRain();
initSplashes();
initSteam();
initDust();
initStars();
buildScooters();
setCameraAuto(0);
renderer.setAnimationLoop(animate);

</script>
</body>
